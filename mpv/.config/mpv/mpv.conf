sub-visibility=yes
sub-auto=fuzzy
alang=jpn,jp,en
slang=jpn,jp,en
audio-file-auto=fuzzy
save-position-on-quit=yes
autofit-larger=100%x100%
geometry=50%:50%
sub-font-size=30
sub-file-paths=sub:subs:Subs:subtitles:Subtitles:ass:ASS

# extensions to check: mpvacious

# screenshot settings
screenshot-directory=/home/keys/.var/app/net.ankiweb.Anki/data/Anki2/User 1/collection.media
screenshot-template=mpv-%wH%wM%wS
