MBTN_LEFT cycle pause
# --- seeking ---
j seek -5
k seek 5
J seek -30
K seek 30
# --- subtitle size ---
- add sub-scale -0.1
= add sub-scale 0.1
# --- volume ---
[ add volume -5
] add volume 5
# --- subtitle delay (fine) ---
z add sub-delay -0.1
x add sub-delay 0.1
# --- subtitle delay (coarse) ---
Z add sub-delay -1
X add sub-delay 1
# --- subtitle navigation ---
h sub-seek -1
l sub-seek 1
# --- screenshot + copy to clipboard ---
s screenshot; run "sh" "-c" "file=$(basename \"$(ls -t '/home/keys/.var/app/net.ankiweb.Anki/data/Anki2/User 1/collection.media'/mpv-* 2>/dev/null | head -1)\"); echo \"<img src=\\\"$file\\\">\" | wl-copy"
# --- primary subtitles ---
c cycle sub
# --- secondary subtitles ---
n cycle secondary-sub-visibility
b cycle secondary-sid
