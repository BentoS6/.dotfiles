general {
    # pidof guard avoids stacking multiple hyprlock instances
    lock_cmd = pidof hyprlock || hyprlock

    # lock before suspending
    before_sleep_cmd = loginctl lock-session

    # wake the panel on resume, so you don't have to press a key twice
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 5 min — dim the keyboard backlight
listener {
    timeout    = 300
    on-timeout = brightnessctl -sd tpacpi::kbd_backlight set 0
    on-resume  = brightnessctl -rd tpacpi::kbd_backlight
}

# 10 min — lock. Must come BEFORE the screen blanks.
listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

# 10.5 min — blank the screen, 30s after the lock has engaged
listener {
    timeout    = 630
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 15 min — suspend
listener {
    timeout    = 900
    on-timeout = systemctl suspend
}