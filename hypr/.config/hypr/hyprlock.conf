# BACKGROUND
background {
    monitor =
    #path = screenshot
    color = rgb(40, 40, 40)
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 50, 25
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgb(235, 219, 178)
    inner_color = rgb(40, 40, 40)
    font_color = rgb(235, 219, 178)
    fade_on_empty = false
    rounding = -1
    check_color = rgb(235, 219, 178)
    placeholder_text =
    hide_input = false
    position = 0, -205
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M")"
    color = rgb(235, 219, 178)
    font_size = 38
    font_family = JetBrains Mono
    position = 0, 225
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgb(235, 219, 178)
    font_size = 14
    font_family = JetBrains Mono
    position = 0, 268
    halign = center
    valign = center
}

# PROFILE PICTURE
image {
    monitor =
    path = /home/keys/me_meow/wallpapers/wallhaven-kx8jw7.png
    rounding = 10
    size = 360
    border_size = 2
    border_color = rgb(235, 219, 178)
    position = 0, 0
    halign = center
    valign = center
}